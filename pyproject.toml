[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-builder"
version = "0.5.0"
description = "Agente de programación con DeepSeek (PRO escribe y verifica / FLASH lee y resume), tools, DEEP.md, skills y PWA remota"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "Cynchro Labs", email = "alexissaucedo@gmail.com" }
]
keywords = ["deepseek", "ai", "cli", "code-generation", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "prompt_toolkit",
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "python-multipart"]
https = ["trustme", "qrcode"]
all = ["fastapi", "uvicorn[standard]", "python-multipart", "trustme", "qrcode"]

[project.urls]
Homepage = "https://github.com/cynchro/deepseekCLI"
Repository = "https://github.com/cynchro/deepseekCLI"
"Bug Tracker" = "https://github.com/cynchro/deepseekCLI/issues"
Documentation = "https://github.com/cynchro/deepseekCLI#readme"

[project.scripts]
deep = "deep:main"

[tool.setuptools]
py-modules = ["deep"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "pwa*"]

[tool.setuptools.package-data]
pwa = ["static/*"]

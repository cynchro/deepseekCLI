[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseekcli"
version = "0.1.0"
description = "CLI/REPL para generar proyectos con DeepSeek"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
https = ["trustme"]

[project.scripts]
deep = "deep:main"

[tool.setuptools]
py-modules = ["deep"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "pwa*"]

[tool.setuptools.package-data]
pwa = ["static/*"]

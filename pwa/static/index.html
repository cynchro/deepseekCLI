<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>deep</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Pantalla de login -->
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <div class="auth-logo">deep</div>
      <p class="auth-sub">Ingresá tu contraseña para continuar</p>
      <input type="password" id="password-input" placeholder="contraseña" autocomplete="current-password">
      <button id="auth-btn">Entrar</button>
      <p id="auth-error" class="error hidden">Contraseña incorrecta</p>
    </div>
  </div>

  <!-- Pantalla de chat -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="header-left">
        <span class="logo">deep</span>
        <button id="workspace-btn" class="workspace-btn" title="Elegir directorio de trabajo">
          <span id="workspace-label" class="workspace-label">elegir dir</span>
          <span class="workspace-chevron">›</span>
        </button>
      </div>
      <div class="header-actions">
        <button id="agent-btn" title="Modo agente (usa herramientas)">&#129302;</button>
        <button id="install-btn" class="hidden" title="Instalar como app">&#11015;</button>
        <button id="projects-btn" title="Mis proyectos">&#9776;</button>
        <button id="balance-btn" title="Ver crédito">$</button>
        <button id="new-chat-btn" title="Nueva conversación">+</button>
      </div>
    </header>

    <!-- Panel overlay compartido -->
    <div id="panel-overlay" class="panel-overlay hidden"></div>

    <!-- Panel de proyectos (historial) -->
    <div id="projects-panel" class="side-panel hidden">
      <div class="panel-header">
        <span class="panel-title">Mis proyectos</span>
        <button id="close-panel-btn" class="close-panel-btn">&#10005;</button>
      </div>
      <div id="projects-list" class="panel-body">
        <p class="panel-empty">Cargando...</p>
      </div>
    </div>

    <!-- Panel explorador de directorios -->
    <div id="dir-browser" class="side-panel hidden">
      <div class="panel-header">
        <div class="dir-nav">
          <button id="dir-up-btn" class="dir-up-btn" title="Subir">↑</button>
          <span id="dir-current" class="dir-current"></span>
        </div>
        <button id="close-dir-btn" class="close-panel-btn">&#10005;</button>
      </div>
      <div class="dir-select-bar">
        <button id="dir-select-btn" class="dir-select-btn">&#10003; Elegir este directorio</button>
      </div>
      <div id="dir-list" class="panel-body"></div>
    </div>

    <!-- Paleta de comandos rápidos (toggle con logo) -->
    <div id="cmd-palette" class="cmd-palette hidden">
      <div class="cmd-chips">
        <span class="chip">💬 ask</span>
        <span class="chip">🏗 build</span>
        <span class="chip">🔧 fix</span>
        <span class="chip">✏️ update</span>
        <span class="chip">📄 show</span>
        <span class="chip">📜 history</span>
        <span class="chip">💰 balance</span>
      </div>
    </div>

    <div id="messages">
      <div class="welcome">
        <p>¿En qué puedo ayudarte?</p>
        <div class="cmd-chips">
          <span class="chip">💬 ask</span>
          <span class="chip">🏗 build</span>
          <span class="chip">🔧 fix</span>
          <span class="chip">✏️ update</span>
          <span class="chip">📄 show</span>
          <span class="chip">📜 history</span>
          <span class="chip">💰 balance</span>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrapper">
        <textarea id="input" placeholder="Preguntá algo, o escribí build / fix / show…" rows="1"></textarea>
        <span id="cmd-hint"></span>
      </div>
      <button id="send-btn">&#8593;</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
